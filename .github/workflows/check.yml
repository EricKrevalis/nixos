name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # flakes enabled by default with this installer
      - uses: DeterminateSystems/nix-installer-action@main

      # evaluates every host, type errors and bad options without building.
      # the nixos starter host stays commented out in flake.nix, no hardware config to check
      - name: evaluate flake
        run: nix flake check --no-build
